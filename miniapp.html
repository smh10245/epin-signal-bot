<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>뽕실 VIP LIVE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07111f;--card:#0e1b2f;--card2:#12233a;--line:#213853;
  --text:#edf6ff;--muted:#8ea6be;--blue:#2f7cff;--cyan:#47dad7;
  --green:#2bd27f;--yellow:#ffd65a;--orange:#ff9d42;--red:#ff6272;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#07101c,#0a1525 55%,#07101c);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button{font:inherit}.app{max-width:820px;margin:auto;padding:14px 13px 84px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:22px;font-weight:900;letter-spacing:-.4px}.sub{font-size:11px;color:var(--muted);margin-top:3px}
.live{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#0d1c31;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px}
.kpi small{display:block;color:var(--muted);font-size:10px}.kpi strong{display:block;margin-top:4px;font-size:15px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 0 5px}.tab{border:0;border-radius:999px;padding:9px 13px;white-space:nowrap;background:#10223a;color:#a8bdd2}
.tab.on{background:var(--blue);color:#fff;font-weight:800}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-weight:850;font-size:16px}.code{font-size:10px;color:var(--muted);margin-left:5px}
.price{font-size:20px;font-weight:900;margin-top:8px}.status{font-size:11px;font-weight:850;padding:5px 8px;border-radius:999px;background:#0b1728;border:1px solid #213957}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}.metric{background:#0a1727;border:1px solid #182f4a;border-radius:11px;padding:8px;text-align:center}
.metric small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.metric b{font-size:12px}
.scorebar{height:7px;background:#071321;border-radius:99px;overflow:hidden;margin-top:11px}.scorebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#377cff,#36d5b2)}
.note{font-size:11px;color:#bfd0df;margin-top:9px;line-height:1.45}.empty{text-align:center;color:var(--muted);padding:38px 0}
.section-title{font-size:13px;font-weight:850;margin:16px 2px 7px}.signal{font-size:12px;padding:10px 11px;background:#0b1828;border:1px solid #1b3450;border-radius:12px;margin:7px 0}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.orange{color:var(--orange)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(6,15,27,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.bottomin{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:11px;color:#fff;background:#142944;font-weight:800}.btn.primary{background:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(2,7,13,.78);z-index:30;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:820px;margin:auto;background:#091728;border:1px solid #203954;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{font-size:19px;margin:0}.sheet .close{border:0;background:#172b43;color:#fff;border-radius:10px;padding:7px 10px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.detailbox{background:#0d1c30;border:1px solid #1b3551;border-radius:12px;padding:9px;text-align:center}.detailbox small{display:block;color:var(--muted);font-size:9px}.detailbox b{font-size:13px}
.chartwrap{height:260px;background:#081421;border-radius:14px;padding:8px;border:1px solid #19314b}
@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><div class="brand">🤖 뽕실 VIP LIVE</div><div class="sub" id="stamp">Telegram 연결 확인 중...</div></div>
    <div class="live" id="ws">WS -</div>
  </div>

  <div class="kpis">
    <div class="kpi"><small>시장 위험</small><strong id="risk">-</strong></div>
    <div class="kpi"><small>VIP</small><strong id="vipCount">-</strong></div>
    <div class="kpi"><small>보유</small><strong id="holdCount">-</strong></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="all">전체</button>
    <button class="tab" data-tab="signal">🟢 타점</button>
    <button class="tab" data-tab="watch">🟡 관찰</button>
    <button class="tab" data-tab="hold">💼 보유</button>
    <button class="tab" data-tab="history">📋 기록</button>
  </div>
  <section id="list"></section>
</div>

<div class="bottom">
  <div class="bottomin">
    <button class="btn primary" onclick="loadState()">🔄 새로고침</button>
    <button class="btn" onclick="tg?.close()">✕ 닫기</button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeDetail()">
  <div class="sheet">
    <div class="row"><div><h2 id="dName">종목</h2><div class="sub" id="dStage"></div></div><button class="close" onclick="closeDetail()">닫기</button></div>
    <div class="detail-grid" id="dGrid"></div>
    <div class="chartwrap"><canvas id="chart"></canvas></div>
    <div class="section-title">현재 판단</div><div class="signal" id="dNote"></div>
  </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#07111f');tg.setBackgroundColor('#07111f')}catch(e){}}
const initData=tg?.initData||'';
let STATE=null,active='all',chart=null;
const $=id=>document.getElementById(id);
const won=n=>Number(n||0).toLocaleString('ko-KR');
const ago=s=>{if(!s)return '-';const d=(Date.now()-new Date(s).getTime())/1000;if(d<60)return Math.max(0,Math.round(d))+'초 전';if(d<3600)return Math.round(d/60)+'분 전';return Math.round(d/3600)+'시간 전'};
const stageColor=s=>({SIGNAL:'var(--green)',READY:'var(--orange)',PULLBACK:'var(--yellow)',HOLD:'var(--blue)',COOLDOWN:'var(--muted)',WAIT:'var(--muted)'})[s]||'var(--muted)';
const authHeaders=()=>({'X-Telegram-Init-Data':initData});

function vipCard(t){
  const sc=Math.max(0,Math.min(100,Number(t.score||0)));
  return `<div class="card" onclick="openDetail('${t.code}')">
    <div class="row"><div><span class="name">${t.name}</span><span class="code">${t.code}</span></div><span class="status" style="color:${stageColor(t.stage)}">${t.stage_label}</span></div>
    <div class="row"><div class="price">${won(t.price)}원</div><div class="sub">마지막체결 ${ago(t.last_tick_at)}</div></div>
    <div class="metrics">
      <div class="metric"><small>체결강도</small><b>${Number(t.strength||0).toFixed(0)}</b></div>
      <div class="metric"><small>거래량비</small><b>${Number(t.volume_ratio||0).toFixed(2)}</b></div>
      <div class="metric"><small>VWAP</small><b>${won(t.vwap)}</b></div>
      <div class="metric"><small>지지 / 저항</small><b>${won(t.support)} / ${won(t.resistance)}</b></div>
    </div>
    <div class="scorebar"><i style="width:${sc}%"></i></div>
    <div class="note">${t.note||'조건 대기'} · ${Math.round(sc)}점${t.orderbook_imbalance?` · 호가 ${Number(t.orderbook_imbalance).toFixed(2)}배`:''}</div>
  </div>`;
}

function holdCard(h){
  const cls=h.return_pct>=0?'good':'bad';
  return `<div class="card" onclick="openDetail('${h.code}')">
    <div class="row"><div><span class="name">${h.name}</span><span class="code">${h.code}</span></div><b class="${cls}">${h.return_pct>=0?'+':''}${Number(h.return_pct).toFixed(2)}%</b></div>
    <div class="metrics">
      <div class="metric"><small>매수가</small><b>${won(h.entry)}</b></div>
      <div class="metric"><small>현재가</small><b>${won(h.current)}</b></div>
      <div class="metric"><small>방어선</small><b>${won(h.stop)}</b></div>
      <div class="metric"><small>관리단계</small><b>Lv.${h.level}</b></div>
    </div>
  </div>`;
}

function historyView(){
  let out='<div class="section-title">최근 신호</div>';
  const sig=STATE?.signals||[];
  out+=sig.length?sig.slice(0,10).map(s=>`<div class="signal">🟢 <b>${s.name}</b> · ${won(s.price)}원<br><span class="sub">${s.time||''} · 체결강도 ${Number(s.strength||0).toFixed(0)} · 점수 ${Number(s.score||0).toFixed(0)}</span></div>`).join(''):'<div class="empty">최근 신호 없음</div>';
  out+='<div class="section-title">최근 매매 기록</div>';
  const tr=STATE?.trades||[];
  out+=tr.length?tr.slice(0,10).map(x=>`<div class="signal">💼 <b>${x.name}</b> · <span class="${Number(x.return_pct)>=0?'good':'bad'}">${Number(x.return_pct)>=0?'+':''}${Number(x.return_pct).toFixed(2)}%</span><br><span class="sub">${x.closed_at||''} · ${x.reason||''}</span></div>`).join(''):'<div class="empty">매매 기록 없음</div>';
  return out;
}

function render(){
  if(!STATE)return;
  $('risk').innerHTML=`<span class="${STATE.market.risk==='RISK'?'bad':STATE.market.risk==='CAUTION'?'warn':'good'}">${STATE.market.risk}</span>`;
  $('vipCount').textContent=STATE.vip.length;
  $('holdCount').textContent=STATE.holdings.length;
  $('ws').textContent=`WS ${STATE.runtime.ws||'-'} · 체결 ${STATE.runtime.trade_subscribed||0}`;
  $('stamp').textContent=`업데이트 ${new Date(STATE.server_time).toLocaleTimeString('ko-KR')}`;
  if(active==='history'){$('list').innerHTML=historyView();return}
  if(active==='hold'){$('list').innerHTML=STATE.holdings.length?STATE.holdings.map(holdCard).join(''):'<div class="empty">보유 종목 없음</div>';return}
  let rows=STATE.vip;
  if(active==='signal')rows=rows.filter(x=>x.stage==='SIGNAL'||x.stage==='READY');
  if(active==='watch')rows=rows.filter(x=>x.stage==='PULLBACK');
  $('list').innerHTML=rows.length?rows.map(vipCard).join(''):'<div class="empty">현재 해당 종목 없음</div>';
}

async function loadState(){
  try{
    const r=await fetch('/api/miniapp/state',{headers:authHeaders(),cache:'no-store'});
    if(r.status===401){$('stamp').textContent='Telegram 안에서 Mini App을 열어주세요';return}
    STATE=await r.json();render();
  }catch(e){$('stamp').textContent='서버 연결 실패'}
}

async function openDetail(code){
  try{
    const r=await fetch('/api/miniapp/stock/'+code,{headers:authHeaders(),cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json(),s=d.state||{};
    $('dName').textContent=d.name+' · '+d.code;
    $('dStage').textContent=s.stage_label||'';
    $('dGrid').innerHTML=[
      ['현재가',won(s.price)+'원'],['체결강도',Number(s.strength||0).toFixed(0)],['거래량비',Number(s.volume_ratio||0).toFixed(2)],
      ['VWAP',won(s.vwap)],['지지',won(s.support)],['저항',won(s.resistance)],
      ['점수',Number(s.score||0).toFixed(0)],['눌림',Number(s.pullback_pct||0).toFixed(2)+'%'],['호가',d.orderbook?Number(d.orderbook.imbalance).toFixed(2)+'배':'-']
    ].map(x=>`<div class="detailbox"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');
    $('dNote').textContent=s.note||'조건 대기';
    $('modal').classList.add('on');
    const labels=d.bars.map(b=>new Date(b.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    const prices=d.bars.map(b=>b.close);
    if(chart)chart.destroy();
    chart=new Chart($('chart'),{
      type:'line',
      data:{labels,datasets:[
        {label:'현재가',data:prices,borderColor:'#47dad7',borderWidth:2,pointRadius:0,tension:.2},
        {label:'VWAP',data:prices.map(()=>s.vwap||null),borderColor:'#ffd65a',borderWidth:1,pointRadius:0,borderDash:[5,5]},
        {label:'지지',data:prices.map(()=>s.support||null),borderColor:'#2bd27f',borderWidth:1,pointRadius:0,borderDash:[3,4]},
        {label:'저항',data:prices.map(()=>s.resistance||null),borderColor:'#ff6272',borderWidth:1,pointRadius:0,borderDash:[3,4]}
      ]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#9db4c9',boxWidth:10}}},scales:{x:{ticks:{color:'#7890a7',maxTicksLimit:6},grid:{color:'#10243a'}},y:{ticks:{color:'#7890a7'},grid:{color:'#10243a'}}}}
    });
  }catch(e){}
}
function closeDetail(){$('modal').classList.remove('on')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');active=b.dataset.tab;render()});
loadState();setInterval(loadState,3000);
</script>
</body>
</html>
